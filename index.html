<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<title>GUY MAN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, #0a0014, #1a0030);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; color: #ff3ba0;
    font-size: 14px; letter-weight: 700; letter-spacing: 0.4em; text-align: center;
    text-transform: uppercase; pointer-events: auto; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  #rotate .icon { font-size: 96px; animation: spin 2s ease-in-out infinite; }
  #rotate .hint { font-size: 12px; opacity: 0.8; letter-spacing: 0.28em; }
  @keyframes spin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0014, #1a0030, #0a0014);
    transition: opacity 0.5s ease; gap: 20px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading.error {
    background: radial-gradient(circle at center, rgba(255,59,160,0.18), rgba(0,0,0,0.96));
  }
  #loading h1 {
    font-size: 52px; font-weight: 900; letter-spacing: 0.3em;
    background: linear-gradient(90deg, #ff3ba0, #ff7b3b, #ffd23b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #loading .sub { font-size: 11px; letter-spacing: 0.4em; color: #7a6a8a; text-transform: uppercase; }
  #loading .bar { width: 240px; height: 2px; background: #1a0a2a; overflow: hidden; border-radius: 2px; }
  #loading .bar-inner {
    width: 40%; height: 100%;
    background: linear-gradient(90deg, #ff3ba0, #ffd23b);
    animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  #mainMenu {
    position: fixed; inset: 0; z-index: 200;
    background: radial-gradient(ellipse at center, rgba(26,0,48,0.5), rgba(0,0,0,0.95)),
                linear-gradient(135deg, #0a0014, #1a0030);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  #mainMenu.hidden { display: none; }
  #mainMenu h1 {
    font-size: 64px; font-weight: 900; letter-spacing: 0.2em;
    background: linear-gradient(180deg, #fff, #ff3ba0 60%, #ff7b3b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px; text-shadow: 0 0 60px rgba(255,59,160,0.5);
  }
  #mainMenu .tagline { font-size: 12px; letter-spacing: 0.5em; color: #7a6a8a; margin-bottom: 40px; text-transform: uppercase; }
  #mainMenu button {
    padding: 16px 60px; margin: 8px 0; background: transparent; color: #fff;
    border: 1px solid rgba(255, 59, 160, 0.4); border-radius: 4px;
    font-size: 14px; letter-spacing: 0.4em; font-weight: 700;
    text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; min-width: 280px;
  }
  #mainMenu button:hover { background: rgba(255, 59, 160, 0.15); border-color: #ff3ba0; box-shadow: 0 0 30px rgba(255,59,160,0.4); transform: translateY(-1px); }
  #mainMenu .footer { position: absolute; bottom: 30px; font-size: 10px; letter-spacing: 0.3em; color: #5a4a6a; text-transform: uppercase; }
</style>
</head>
<body>
<div id="rotate" aria-label="Rotate to landscape" role="button" tabindex="0">
  <div class="icon"><i class="bi bi-phone-landscape"></i></div>
  <div>Rotate to landscape</div>
  <div class="hint">Tap to switch</div>
</div>

<div id="loading">
  <h1>GUY MAN</h1>
  <div class="sub">OFFICIAL GAME</div>
  <div class="bar"><div class="bar-inner"></div></div>
  <div class="sub" id="loadStatus" style="font-size:9px;color:#5a4a6a;">PROBING HARDWARE…</div>
</div>

<div id="mainMenu" class="hidden">
  <h1>GUYMAN</h1>
  <div class="tagline">Official Game</div>
  <button id="btnPlay">PLAY</button>
  <button id="btnControls">CONTROLS</button>
  <div class="footer">Three.js r180 · WebGPU · Mobile Ready</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const rotateEl = $('rotate');
const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && /Macintosh/i.test(navigator.userAgent));

function syncLandscapeOverlay() {
  const portrait = window.innerHeight > window.innerWidth;
  const coarse = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  const fs = !!document.fullscreenElement;
  rotateEl.style.display = (portrait && coarse && !fs) ? 'flex' : 'none';
}

async function requestLandscapeMode() {
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }
  } catch (_) {}

  try {
    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      await screen.orientation.lock('landscape');
    }
  } catch (_) {}

  syncLandscapeOverlay();
}

rotateEl.addEventListener('click', requestLandscapeMode);
rotateEl.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    requestLandscapeMode();
  }
});
window.addEventListener('resize', syncLandscapeOverlay);
window.addEventListener('orientationchange', syncLandscapeOverlay);
document.addEventListener('fullscreenchange', syncLandscapeOverlay);
syncLandscapeOverlay();

$('loadStatus').textContent = 'PROBING HARDWARE…';

const webGpuAvailable = !!navigator.gpu && typeof navigator.gpu.requestAdapter === 'function';
if (!webGpuAvailable) {
  const loading = $('loading');
  const status = $('loadStatus');
  status.textContent = 'WEBGPU UNAVAILABLE';
  status.style.color = '#ff7b3b';
  status.style.letterSpacing = '0.2em';
  const h1 = loading.querySelector('h1');
  if (h1) h1.textContent = 'UNSUPPORTED';

  const mainMenu = $('mainMenu');
  const tagline = mainMenu.querySelector('.tagline');
  if (tagline) tagline.textContent = 'Use Chrome/Edge on localhost or HTTPS';
  const playButton = $('btnPlay');
  if (playButton) playButton.disabled = true;
  mainMenu.classList.remove('hidden');
  loading.classList.add('hidden');
  if (isMobileDevice) syncLandscapeOverlay();
} else {
  const loading = $('loading');
  setTimeout(() => {
    loading.classList.add('hidden');
    $('mainMenu').classList.remove('hidden');
  }, 900);

  $('btnPlay').addEventListener('click', () => {
    $('mainMenu').classList.add('hidden');
    $('loading').classList.add('hidden');
    if (isMobileDevice) syncLandscapeOverlay();
  });

  $('btnControls').addEventListener('click', () => {
    alert('Use WASD / Arrow keys. On mobile, turn landscape and tap the prompt.');
  });
}
</script>
</body>
</html>
